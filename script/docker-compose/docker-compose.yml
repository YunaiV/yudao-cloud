# 芋道 Cloud 微服务版 Docker Compose 入门部署：gateway + system-server + infra-server + 前端 Nginx + MySQL + Redis + Nacos
# 使用说明见同目录 README.md；需 Docker Compose V2.20.2 及以上（docker compose 命令）
# 本文件中的相对路径，均相对于本文件所在目录，与执行命令时的当前目录无关

name: yudao-cloud

# 所有 Java 服务共用：profile、JVM 参数、Nacos 注册中心 + 配置中心
x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx512m}
  SPRING_CLOUD_NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
  SPRING_CLOUD_NACOS_USERNAME: ${NACOS_USERNAME:-}
  SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_PASSWORD:-}
  SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: ${NACOS_NAMESPACE:-public}
  SPRING_CLOUD_NACOS_DISCOVERY_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
  SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: ${NACOS_NAMESPACE:-public}
  SPRING_CLOUD_NACOS_CONFIG_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}

# system-server、infra-server 共用：数据库、Redis，以及 application-dev.yaml 中需要关闭的外部依赖
x-app-env: &app-env
  <<: *common-env
  # 数据库：主库、从库都要覆盖，否则会使用 application-${SPRING_PROFILES_ACTIVE}.yaml 中的 127.0.0.1
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ruoyi-vue-pro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: ${MYSQL_USER:-yudao}
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_PASSWORD}
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ruoyi-vue-pro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_USERNAME: ${MYSQL_USER:-yudao}
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_SLAVE_PASSWORD: ${MYSQL_PASSWORD}
  # Redis：Spring Boot 2.7 使用 spring.redis.*
  SPRING_REDIS_HOST: redis
  SPRING_REDIS_PORT: 6379
  SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
  # application-dev.yaml 默认连接 127.0.0.1:9090 的 XXL-Job 调度中心，入门部署不提供，关闭执行器
  XXL_JOB_ENABLED: "false"
  # application-dev.yaml 默认开启演示模式（禁止写操作），这里关闭
  YUDAO_DEMO: "false"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-yudao}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在 mysql-data 卷为空（首次启动）时执行；SQL 文件不存在时直接报错，避免被创建成空目录
      - type: bind
        source: ../../sql/mysql/ruoyi-vue-pro.sql
        target: /docker-entrypoint-initdb.d/01-ruoyi-vue-pro.sql
        read_only: true
        bind:
          create_host_path: false
    # 默认不对宿主机开放；需要本机客户端连接时，取消注释（避免与本机已有 3306 冲突）
    # ports:
    #   - "127.0.0.1:13306:3306"
    healthcheck:
      # 首次初始化时 MySQL 临时实例不监听 TCP，因此 127.0.0.1 可连通即表示初始化完成
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    # 默认不对宿主机开放；需要时取消注释（避免与本机已有 6379 冲突）
    # ports:
    #   - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 内置单机 Nacos（嵌入式存储），由 .env 的 COMPOSE_PROFILES=nacos 启用；复用已有 Nacos 时清空 COMPOSE_PROFILES
  nacos:
    image: nacos/nacos-server:v3.0.3
    profiles: ["nacos"]
    restart: unless-stopped
    environment:
      MODE: standalone
      # 仅供 Compose 网络内体验，未开启客户端访问鉴权，端口默认不对宿主机开放；共享或生产环境请使用开启鉴权的 Nacos
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-}
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes:
      - nacos-data:/home/nacos/data
    # 需要访问控制台（8080）或本机直连时取消注释；客户端 gRPC 端口固定为 HTTP 端口 + 1000
    # ports:
    #   - "127.0.0.1:18080:8080"
    #   - "127.0.0.1:18848:8848"
    #   - "127.0.0.1:19848:9848"
    healthcheck:
      # 8848（HTTP）与 9848（gRPC）均可连接
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8848 && </dev/tcp/127.0.0.1/9848"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  gateway:
    # 使用模块自带的 Dockerfile，需先在源码根目录执行 mvn 打包，生成 yudao-gateway/target/yudao-gateway.jar
    build:
      context: ../../yudao-gateway
    image: yudao-gateway:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *common-env
    # 便于连接宿主机上已部署的 Nacos：NACOS_SERVER_ADDR=host.docker.internal:8848
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nacos:
        condition: service_healthy
        required: false
    # 默认只通过 web 的 Nginx 访问；需要直连网关排查时，取消注释
    # ports:
    #   - "127.0.0.1:48080:48080"

  system-server:
    build:
      context: ../../yudao-module-system/yudao-module-system-server
    image: yudao-module-system-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *app-env
      # 需与前端打包时的 VITE_APP_CAPTCHA_ENABLE 一致
      YUDAO_CAPTCHA_ENABLE: ${YUDAO_CAPTCHA_ENABLE:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
        required: false

  infra-server:
    build:
      context: ../../yudao-module-infra/yudao-module-infra-server
    image: yudao-module-infra-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
        required: false

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # 前端打包产物（包含 index.html 的目录内容）复制到 ./web/dist
      - type: bind
        source: ./web/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway

volumes:
  mysql-data:
  redis-data:
  nacos-data:
